tls:
    domain: localhost
    email: ops@example.invalid
    acme: false
    server: https://acme-v02.api.letsencrypt.org/directory
    https_port: 18443
    renew_interval: 43200
    retry_interval: 30
namespace_networks:
    prod_demo:
        environment: prod
        namespace: demo
    stage_demo:
        environment: stage
        namespace: demo
compose:
    services:
        bootstrap:
            image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
            entrypoint:
                - python
                - /config/bootstrap.py
            restart: "no"
            volumes:
                - ./configs:/config:ro
                - certificates:/certificates
        haproxy:
            image: haproxy:3.2.25-alpine@sha256:61074191875132a4a61e864f9ec4880b88553b237df7aadecb70060ec44cd63d
            user: "0:0"
            command:
                - haproxy
                - -W
                - -db
                - -f
                - /usr/local/etc/haproxy/haproxy.cfg
            ports:
                - 127.0.0.1:18080:80
                - 127.0.0.1:18443:443
            volumes:
                - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
                - certificates:/certificates:ro
                - runtime:/runtime
            networks:
                - default
                - prod_demo
                - stage_demo
            depends_on:
                bootstrap:
                    condition: service_completed_successfully
            healthcheck:
                test:
                    - CMD
                    - wget
                    - -qO-
                    - http://127.0.0.1/healthz
                interval: 2s
                timeout: 1s
                retries: 10
        certbot:
            image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
            entrypoint:
                - /bin/sh
                - /config/certbot.sh
            volumes:
                - ./configs:/config:ro
                - certificates:/certificates
                - runtime:/runtime
                - letsencrypt:/etc/letsencrypt
            depends_on:
                haproxy:
                    condition: service_healthy
    volumes:
        certificates: {}
        runtime: {}
        letsencrypt: {}
