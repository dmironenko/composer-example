tls:
    domain: localhost
    https_port: 18443
namespace_networks:
    prod_demo:
        environment: prod
        namespace: demo
    stage_demo:
        environment: stage
        namespace: demo
compose:
    services:
        nginx:
            image: jonasal/nginx-certbot:6.2.0-alpine@sha256:60a3ff8e236b2a3ee0daac57ba83b39110771ac48e9b58d80bc3a357bbec4a28
            environment:
                CERTBOT_EMAIL: ops@example.invalid
                USE_LOCAL_CA: "1"
                RENEWAL_INTERVAL: 12h
            ports:
                - 127.0.0.1:18080:80
                - 127.0.0.1:18443:443
            volumes:
                - ./configs/edge.conf:/etc/nginx/user_conf.d/edge.conf:ro
                - ./configs/redirector.conf:/etc/nginx/conf.d/redirector.conf:ro
                - letsencrypt:/etc/letsencrypt
                - local_ca:/etc/local_ca
            networks:
                - default
                - prod_demo
                - stage_demo
            healthcheck:
                test:
                    - CMD
                    - wget
                    - --no-check-certificate
                    - -qO-
                    - https://127.0.0.1/healthz
                interval: 2s
                timeout: 2s
                retries: 30
    volumes:
        letsencrypt: {}
        local_ca: {}
