app:
  message: "api: production"

build:
  repository: https://github.com/hashicorp/http-echo.git
  commit: "767bbd9c3d1905acb04891d5c5e208de17b34a71"

compose:
  services:
    api-http:
      command: sh -c 'exec /usr/local/bin/api -listen=:8080 -text="$(cat /etc/app/message.txt) $(hostname)"'
      volumes:
        - ./configs/message.txt:/etc/app/message.txt:ro
      deploy:
        replicas: 1
      healthcheck:
        test: wget -q -O /dev/null http://127.0.0.1:8080
        interval: 2s
        timeout: 1s
        retries: 10
