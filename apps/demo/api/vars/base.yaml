app:
  message: "api: production"

build:
  repository: https://github.com/dmironenko/composer-example.git
  commit: "9e0d8395d805ed4cb0719e8443c873455135384f"

compose:
  services:
    api-http:
      command: /usr/local/bin/api
      volumes:
        - ./configs/message.txt:/etc/app/message.txt:ro
      deploy:
        replicas: 1
      healthcheck:
        test: wget -q -O /dev/null http://127.0.0.1:8080
        interval: 2s
        timeout: 1s
        retries: 10
