config_revision: v1
network_alias: nginx

compose:
  services:
    nginx:
      image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
      volumes: ['./configs/nginx.conf:/etc/nginx/nginx.conf:ro']
      deploy:
        replicas: 1
      healthcheck:
        test: wget -qO- http://127.0.0.1:8080/healthz
        interval: 2s
        timeout: 1s
        retries: 10
