app:
  config_revision: v1
  network_alias: nginx
  absolute_redirect: 'off'
  proxy_read_timeout: 60s

compose:
  services:
    nginx:
      image: nginx:stable-alpine
      volumes: [./configs/nginx.conf:/etc/nginx/nginx.conf:ro]
      deploy:
        replicas: 1
      healthcheck:
        test: wget -qO- http://127.0.0.1:8080/healthz
        interval: 2s
        timeout: 1s
        retries: 10
